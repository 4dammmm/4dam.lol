<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">

  <!-- ============================================================
       CONFIGURAZIONE: modifica questo oggetto.
       Non inserire token, password o altre credenziali private.
       ============================================================ -->
  <script>
    const CONFIG = {
      username: "nox",
      bio: [
        "Creo cose quando il mondo dorme.",
        "Design, codice e frequenze notturne.",
        "Ci vediamo dall'altra parte dello schermo."
      ],
      location: "Milano, Italia",

      // Vuoto = avatar originale SVG incorporato.
      avatarUrl: "",

      background: {
        // "gradient", "image" oppure "video".
        type: "gradient",
        url: "",
        overlay: 0.48 // Da 0 (trasparente) a 1 (nero).
      },

      // Usa un colore leggibile sullo sfondo scuro.
      accent: "#a8ff78",

      audio: {
        // Sostituisci con un MP3 che hai il diritto di utilizzare.
        // Vuoto = player disabilitato, senza errori.
        url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3",
        title: "After hours",
        volume: 0.25,
        loop: true
      },

      badges: [
        { text: "Night creator", icon: "✦" },
        { text: "Design & code", icon: "⌘" }
      ],

      // Icone disponibili: discord, instagram, tiktok, youtube,
      // github, x, spotify, twitch, link.
      // Sostituisci questi URL dimostrativi con i tuoi profili.
      socials: [
        { nome: "Discord", url: "https://discord.com/", icona: "discord" },
        { nome: "Instagram", url: "https://instagram.com/", icona: "instagram" },
        { nome: "GitHub", url: "https://github.com/", icona: "github" },
        { nome: "Spotify", url: "https://open.spotify.com/", icona: "spotify" }
      ],

      discord: {
        // Opzionale: ID numerico, come stringa. L'utente deve essere
        // monitorato da Lanyard: https://github.com/Phineas/lanyard
        userId: "",
        refreshMs: 30000
      },

      counter: {
        // Servizio pubblico gratuito GET: https://counterapi.com
        // Cambia namespace con un identificatore unico o il tuo dominio.
        // Conta visualizzazioni, non visitatori unici certificati.
        namespace: "nox-afterhours-bio-demo",
        key: "profile",
        endpoint: "https://counterapi.com/api",
        fallback: "Visite non disponibili"
      },

      effects: {
        entry: true,
        particles: true,
        // "stars", "snow" oppure "particles".
        particleStyle: "stars",
        particleCount: 55,
        tilt: true,
        customCursor: true,
        cursorTrail: true,
        typewriter: true,
        animatedTitle: true,
        animatedBackground: true,
        animatedAvatar: true,
        neonGlow: true,
        hoverMotion: true,
        audioPlayer: true,
        discordWidget: true,
        visitCounter: true
      },

      seo: {
        title: "nox — After hours",
        description: "Design, codice e frequenze notturne. Tutti i miei link, in un solo posto.",
        // Per gli scraper social, aggiorna ANCHE i meta tag statici qui sotto.
        image: "",
        url: ""
      }
    };
  </script>

  <!-- Gli scraper Open Graph spesso non eseguono JavaScript:
       personalizza anche questi valori statici prima di pubblicare. -->
  <title>nox — After hours</title>
  <meta name="description" content="Design, codice e frequenze notturne. Tutti i miei link, in un solo posto.">
  <meta name="theme-color" content="#090d0b">
  <meta property="og:type" content="profile">
  <meta property="og:locale" content="it_IT">
  <meta property="og:title" content="nox — After hours">
  <meta property="og:description" content="Il mio piccolo angolo di internet, dopo mezzanotte.">
  <meta property="og:image" content="">
  <meta property="og:url" content="">
  <meta name="twitter:card" content="summary_large_image">

  <style>
    :root {
      color-scheme: dark;
      --accent: #a8ff78;
      --ink: #f3f7f1;
      --muted: #b2bdb2;
      --overlay: .48;
    }

    *, *::before, *::after { box-sizing: border-box; }
    [hidden] { display: none !important; }

    html { min-height: 100%; background: #090d0b; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      color: var(--ink);
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      -webkit-tap-highlight-color: transparent;
      overflow-x: hidden;
    }

    button, input, a { touch-action: manipulation; }
    button, input { font: inherit; }
    button, a { -webkit-user-select: none; user-select: none; }
    button { color: inherit; }
    a { color: inherit; text-decoration: none; }

    :focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 5px;
    }

    button:disabled { cursor: not-allowed; opacity: .5; }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
      border: 0;
    }

    /* Sfondo originale: una luce verde attraverso una stanza notturna. */
    .background, .scrim, #particles {
      position: fixed;
      inset: 0;
      pointer-events: none;
    }

    .background { z-index: -3; overflow: hidden; background: #090d0b; }

    .ambient {
      position: absolute;
      inset: -20%;
      background:
        radial-gradient(ellipse at 25% 25%, #315b36 0, transparent 44%),
        radial-gradient(ellipse at 85% 78%, #143a37 0, transparent 45%),
        linear-gradient(145deg, #0a100e 12%, #111e17 52%, #050907);
      transform: rotate(-8deg) scale(1.1);
    }

    .background::after {
      content: "";
      position: absolute;
      inset: 0;
      opacity: .08;
      background: repeating-linear-gradient(
        0deg, transparent 0 3px, #d8ffe0 3px 4px
      );
    }

    .background img, .background video {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .scrim { z-index: -2; background: rgb(0 0 0 / var(--overlay)); }
    #particles { z-index: -1; width: 100%; height: 100%; }

    body.motion-background .ambient {
      animation: atmosphere 24s ease-in-out infinite alternate;
    }

    @keyframes atmosphere {
      to { transform: rotate(8deg) scale(1.22) translate(3%, -2%); }
    }

    .page {
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: max(32px, env(safe-area-inset-top))
        max(20px, env(safe-area-inset-right))
        max(32px, env(safe-area-inset-bottom))
        max(20px, env(safe-area-inset-left));
      perspective: 1100px;
    }

    .profile {
      width: min(100%, 490px);
      padding: 30px;
      background: rgb(15 22 18 / .78);
      border: 1px solid color-mix(in srgb, var(--accent) 36%, transparent);
      border-radius: 28px;
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      transform: rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg));
      transition: transform .18s ease-out, opacity .65s ease;
      position: relative;
    }

    body.glow .profile {
      box-shadow:
        0 0 0 6px rgb(255 255 255 / .015),
        0 0 65px color-mix(in srgb, var(--accent) 9%, transparent),
        0 26px 90px rgb(0 0 0 / .4);
    }

    body.waiting .profile { opacity: 0; }
    .brand-row, .identity, .player-top, .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand-row { margin-bottom: 30px; color: var(--muted); font-size: 13px; }
    .brand { display: inline-flex; align-items: center; gap: 8px; }
    .logo { width: 24px; height: 24px; color: var(--accent); }
    .brand-word { font-weight: 650; letter-spacing: -.035em; font-size: 17px; }

    .signal { display: flex; align-items: center; gap: 6px; }
    .signal i { width: 5px; height: 5px; background: var(--accent); border-radius: 50%; }

    .identity { justify-content: flex-start; gap: 20px; }
    .avatar-ring {
      position: relative;
      flex: 0 0 88px;
      width: 88px;
      height: 88px;
      display: grid;
      place-items: center;
      isolation: isolate;
    }

    .avatar-ring::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      border-radius: 50%;
      background: conic-gradient(from 0deg, transparent, var(--accent), transparent 75%);
    }

    body.motion-avatar .avatar-ring::before { animation: orbit 7s linear infinite; }
    @keyframes orbit { to { transform: rotate(360deg); } }

    .avatar-ring img {
      width: 80px;
      height: 80px;
      border: 4px solid #101812;
      border-radius: 50%;
      object-fit: cover;
      background: #132018;
    }

    .identity-copy { min-width: 0; }

    h1 {
      margin: 0;
      font-size: clamp(36px, 9vw, 49px);
      letter-spacing: -.065em;
      line-height: 1.05;
      overflow-wrap: anywhere;
    }

    .location {
      display: flex;
      align-items: center;
      gap: 5px;
      color: var(--muted);
      font-size: 13px;
      margin: 9px 0 0;
      overflow-wrap: anywhere;
    }

    .icon { width: 20px; height: 20px; flex-shrink: 0; }
    .location .icon { width: 15px; height: 15px; }

    .badges { display: flex; flex-wrap: wrap; gap: 8px; margin: 23px 0 0; }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      font-size: 12px;
      border-radius: 8px;
      color: #dfebdc;
      background: rgb(255 255 255 / .055);
      overflow-wrap: anywhere;
      max-width: 100%;
    }

    .badge span:first-child { color: var(--accent); }

    .bio {
      min-height: 3.2em;
      margin: 19px 0 25px;
      color: #d2dbd0;
      font-size: 16px;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .caret {
      display: inline-block;
      width: 2px;
      height: 1em;
      margin-left: 4px;
      background: var(--accent);
      vertical-align: -.1em;
      animation: blink 1s step-end infinite;
    }

    @keyframes blink { 50% { opacity: 0; } }

    .socials { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .social {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 52px;
      padding: 13px 15px;
      border-radius: 13px;
      background: rgb(255 255 255 / .055);
      transition: background .2s, color .2s, transform .2s;
      font-size: 14px;
      font-weight: 550;
    }

    .social-name { overflow-wrap: anywhere; min-width: 0; }
    .social .arrow { margin-left: auto; opacity: .5; flex-shrink: 0; }

    .discord {
      display: flex;
      align-items: center;
      gap: 11px;
      margin-top: 18px;
      padding: 14px;
      background: rgb(255 255 255 / .035);
      border-radius: 13px;
    }

    .discord-avatar { width: 38px; height: 38px; object-fit: cover; border-radius: 12px; }
    .discord-copy { min-width: 0; flex: 1; }
    .discord-name { margin: 0 0 3px; font-size: 13px; font-weight: 600; overflow-wrap: anywhere; }
    .discord-activity { margin: 0; font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #89918b; flex-shrink: 0; }

    .player { margin-top: 25px; }
    .player-top { gap: 10px; }

    .play {
      flex: 0 0 42px;
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      background: var(--accent);
      color: #0a1607;
      border: 0;
      border-radius: 50%;
      cursor: pointer;
    }

    .track { min-width: 0; flex: 1; }
    .track-label { display: block; font-size: 11px; color: var(--muted); margin-bottom: 3px; }
    .track-title { display: block; font-size: 13px; font-weight: 600; overflow-wrap: anywhere; }
    .volume { display: flex; align-items: center; gap: 6px; }
    .volume .icon { width: 16px; height: 16px; color: var(--muted); }

    input[type="range"] {
      accent-color: var(--accent);
      cursor: pointer;
      min-height: 32px;
      margin: 0;
      max-width: 100%;
    }

    #volume { width: 65px; }
    #progress { display: block; width: 100%; margin-top: 9px; }
    .time { display: flex; justify-content: space-between; color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }

    .card-footer { margin-top: 24px; color: var(--muted); font-size: 11px; }
    .visits { display: inline-flex; align-items: center; gap: 6px; }
    .visits .icon { width: 15px; height: 15px; }
    .footer-note { margin-left: auto; text-align: right; }

    /* Il pulsante d'ingresso è accessibile anche con Invio e Spazio. */
    .entry {
      position: fixed;
      inset: 0;
      z-index: 20;
      width: 100%;
      height: 100%;
      border: 0;
      padding: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 15px;
      background: rgb(5 10 7 / .5);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      cursor: pointer;
      transition: opacity .6s ease, visibility .6s;
    }

    .entry .logo { width: 65px; height: 65px; margin-bottom: 13px; }
    .entry-title { font-size: clamp(30px, 8vw, 48px); letter-spacing: -.055em; font-weight: 650; }
    .entry-hint { color: #c4cec1; font-size: 13px; }
    .entry.leaving { opacity: 0; visibility: hidden; pointer-events: none; }

    #cursor, #cursor-trail {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 50;
      border-radius: 50%;
      pointer-events: none;
      opacity: 0;
    }

    #cursor { width: 7px; height: 7px; background: var(--accent); }
    #cursor-trail { width: 29px; height: 29px; border: 1px solid var(--accent); opacity: 0; }

    @media (hover: hover) and (pointer: fine) {
      body.cursor-on, body.cursor-on a, body.cursor-on button { cursor: none; }
      body.hover-motion .social:hover {
        transform: translateY(-3px);
        background: color-mix(in srgb, var(--accent) 15%, #151e17);
        color: var(--accent);
      }
    }

    @media (max-width: 420px) {
      .profile { padding: 24px 20px; border-radius: 23px; }
      .brand-row { margin-bottom: 26px; }
      .identity { gap: 15px; }
      .social { padding: 12px; gap: 8px; }
      .volume { gap: 4px; }
      #volume { width: 52px; }
    }

    @media (max-width: 330px) {
      .socials { grid-template-columns: 1fr; }
      .player-top { flex-wrap: wrap; }
      .volume { margin-left: auto; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
        scroll-behavior: auto !important;
      }
      .profile { transform: none !important; }
      #particles, #cursor, #cursor-trail, .caret { display: none !important; }
      body.cursor-on, body.cursor-on a, body.cursor-on button { cursor: auto; }
    }
  </style>
</head>

<body>

  <div class="background" id="background" aria-hidden="true">
    <div class="ambient"></div>
  </div>
  <div class="scrim" aria-hidden="true"></div>
  <canvas id="particles" aria-hidden="true"></canvas>

  <main class="page" id="main">
    <article class="profile" id="profile" aria-labelledby="username" tabindex="-1">
      <header class="brand-row">
        <span class="brand">
          <svg class="logo" aria-hidden="true"><use href="#i-logo"></use></svg>
          <span class="brand-word">afterhours</span>
        </span>
        <span class="signal"><i aria-hidden="true"></i> personal space</span>
      </header>

      <div class="identity">
        <div class="avatar-ring">
          <img id="avatar" width="80" height="80" alt="Avatar di nox">
        </div>
        <div class="identity-copy">
          <h1 id="username">nox</h1>
          <p class="location" id="location-row">
            <svg class="icon" aria-hidden="true"><use href="#i-pin"></use></svg>
            <span id="location"></span>
          </p>
        </div>
      </div>

      <div class="badges" id="badges" aria-label="Badge personali"></div>

      <p class="bio">
        <!-- L'animazione non viene annunciata lettera per lettera. -->
        <span id="bio-visual" aria-hidden="true"></span>
        <span class="caret" id="caret" aria-hidden="true"></span>
        <span id="bio-accessible" class="sr-only"></span>
      </p>

      <nav class="socials" id="socials" aria-label="Profili social"></nav>

      <section class="discord" id="discord" aria-label="Presenza Discord" hidden>
        <img class="discord-avatar" id="discord-avatar" width="38" height="38" alt="Avatar Discord">
        <div class="discord-copy">
          <p class="discord-name" id="discord-name"></p>
          <p class="discord-activity" id="discord-activity"></p>
        </div>
        <span class="status-dot" id="discord-dot" aria-hidden="true"></span>
      </section>

      <section class="player" id="player" aria-label="Player musicale">
        <div class="player-top">
          <button class="play" id="play" type="button" aria-label="Riproduci musica" aria-pressed="false">
            <svg class="icon" aria-hidden="true"><use id="play-icon" href="#i-play"></use></svg>
          </button>
          <div class="track">
            <span class="track-label" id="audio-status">Colonna sonora</span>
            <span class="track-title" id="track-title"></span>
          </div>
          <div class="volume">
            <svg class="icon" aria-hidden="true"><use href="#i-volume"></use></svg>
            <label for="volume" class="sr-only">Volume</label>
            <input id="volume" type="range" min="0" max="1" step="0.01" value="0.25">
          </div>
        </div>
        <label for="progress" class="sr-only">Posizione nella traccia</label>
        <input id="progress" type="range" min="0" max="100" step="0.1" value="0" disabled>
        <div class="time" aria-hidden="true">
          <span id="elapsed">0:00</span>
          <span id="duration">--:--</span>
        </div>
        <span class="sr-only" id="audio-message" role="status"></span>
      </section>

      <footer class="card-footer">
        <span class="visits" id="visits">
          <svg class="icon" aria-hidden="true"><use href="#i-eye"></use></svg>
          <span id="visit-count">Visite · —</span>
        </span>
        <span class="footer-note">a little less ordinary.</span>
      </footer>
    </article>
  </main>

  <button class="entry" id="entry" type="button" aria-label="Entra nel profilo e avvia la musica">
    <svg class="logo" aria-hidden="true"><use href="#i-logo"></use></svg>
    <span class="entry-title">Click to enter</span>
    <span class="entry-hint" id="entry-hint">Un piccolo spazio. Le mie frequenze.</span>
  </button>

  <audio id="audio" preload="none"></audio>
  <div id="cursor" aria-hidden="true"></div>
  <div id="cursor-trail" aria-hidden="true"></div>

  <noscript>
    <style>
      #entry, .player, .visits, .caret { display: none !important; }
    </style>
    <p style="padding:20px;text-align:center">
      Attiva JavaScript per caricare il profilo personalizzato e i suoi link.
    </p>
  </noscript>

  <script>
    "use strict";

    const $ = id => document.getElementById(id);
    const fx = CONFIG.effects;
    const reduced = matchMedia("(prefers-reduced-motion: reduce)");
    const finePointer = matchMedia("(hover: hover) and (pointer: fine)");
    const clamp = (value, min, max) => Math.min(max, Math.max(min, value));
    const accent = CSS.supports("color", CONFIG.accent) ? CONFIG.accent : "#a8ff78";

    document.documentElement.style.setProperty("--accent", accent);
    document.documentElement.style.setProperty(
      "--overlay", clamp(Number(CONFIG.background.overlay) || 0, 0, 1)
    );

    document.body.classList.toggle("motion-background", fx.animatedBackground);
    document.body.classList.toggle("motion-avatar", fx.animatedAvatar);
    document.body.classList.toggle("glow", fx.neonGlow);
    document.body.classList.toggle("hover-motion", fx.hoverMotion);

    // Tutti i dati personalizzati vengono inseriti come testo, mai come HTML.
    $("username").textContent = CONFIG.username;
    $("location").textContent = CONFIG.location;
    $("location-row").hidden = !CONFIG.location;
    $("track-title").textContent = CONFIG.audio.title;

    const defaultTitle = CONFIG.seo.title || CONFIG.username;
    document.title = defaultTitle;

    function setMeta(selector, value) {
      if (value) document.querySelector(selector)?.setAttribute("content", value);
    }

    setMeta('meta[name="description"]', CONFIG.seo.description);
    setMeta('meta[property="og:title"]', defaultTitle);
    setMeta('meta[property="og:description"]', CONFIG.seo.description);
    setMeta('meta[property="og:image"]', CONFIG.seo.image);
    setMeta('meta[property="og:url"]', CONFIG.seo.url);

    // Avatar originale incorporato: resta disponibile anche senza rete.
    const avatarSVG = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160">
      <rect width="160" height="160" rx="80" fill="#142219"/>
      <circle cx="80" cy="80" r="58" fill="#1e3526"/>
      <path d="M47 111V49l66 62V49M47 80h66" fill="none"
        stroke="${accent.replace(/[^#a-zA-Z0-9(),.%\s-]/g, "")}"
        stroke-width="8" stroke-linejoin="round"/>
      <circle cx="123" cy="34" r="5" fill="#e8ffdf"/>
    </svg>`;
    const fallbackAvatar = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(avatarSVG);

    function loadImage(element, url, fallback) {
      element.onerror = () => {
        element.onerror = null;
        element.src = fallback;
      };
      element.src = url || fallback;
    }

    $("avatar").alt = `Avatar di ${CONFIG.username}`;
    loadImage($("avatar"), CONFIG.avatarUrl, fallbackAvatar);

    function icon(name) {
      const allowed = new Set([
        "discord", "instagram", "tiktok", "youtube",
        "github", "x", "spotify", "twitch", "link"
      ]);
      const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      svg.classList.add("icon");
      svg.setAttribute("aria-hidden", "true");
      const use = document.createElementNS(svg.namespaceURI, "use");
      use.setAttribute("href", `#i-${allowed.has(name) ? name : "link"}`);
      svg.append(use);
      return svg;
    }

    for (const item of CONFIG.badges) {
      const badge = document.createElement("span");
      badge.className = "badge";
      const glyph = document.createElement("span");
      glyph.textContent = item.icon || "✦";
      glyph.setAttribute("aria-hidden", "true");
      const text = document.createElement("span");
      text.textContent = item.text;
      badge.append(glyph, text);
      $("badges").append(badge);
    }
    $("badges").hidden = !CONFIG.badges.length;

    for (const item of CONFIG.socials) {
      let url;
      try {
        url = new URL(item.url);
        if (!["https:", "http:"].includes(url.protocol)) continue;
      } catch {
        continue;
      }

      const link = document.createElement("a");
      link.className = "social";
      link.href = url.href;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      link.setAttribute("aria-label", `${item.nome}, apre una nuova scheda`);

      const name = document.createElement("span");
      name.className = "social-name";
      name.textContent = item.nome;

      const arrow = document.createElement("span");
      arrow.className = "arrow";
      arrow.textContent = "↗";
      arrow.setAttribute("aria-hidden", "true");

      link.append(icon(item.icona), name, arrow);
      $("socials").append(link);
    }

    // Media di sfondo: il gradiente resta come fallback.
    let backgroundVideo = null;

    if (CONFIG.background.url && CONFIG.background.type === "image") {
      const image = new Image();
      image.alt = "";
      image.decoding = "async";
      image.onload = () => $("background").append(image);
      image.src = CONFIG.background.url;
    }

    if (CONFIG.background.url && CONFIG.background.type === "video") {
      backgroundVideo = document.createElement("video");
      backgroundVideo.muted = true;
      backgroundVideo.defaultMuted = true;
      backgroundVideo.loop = true;
      backgroundVideo.playsInline = true;
      backgroundVideo.preload = "metadata";
      backgroundVideo.setAttribute("aria-hidden", "true");
      backgroundVideo.addEventListener("error", () => backgroundVideo.hidden = true);
      backgroundVideo.src = CONFIG.background.url;
      $("background").append(backgroundVideo);
    }

    function syncBackgroundVideo() {
      if (!backgroundVideo) return;
      if (reduced.matches || document.hidden) {
        backgroundVideo.pause();
      } else {
        backgroundVideo.play().catch(() => {});
      }
    }

    // Typewriter: una sola catena di timeout, interrotta in background.
    const phrases = (Array.isArray(CONFIG.bio) ? CONFIG.bio : [CONFIG.bio])
      .map(String).filter(Boolean);
    const lines = phrases.length ? phrases : [""];
    $("bio-accessible").textContent = lines.join(" ");

    let typingTimer, phraseIndex = 0, letterIndex = 0, deleting = false;

    function typeStep() {
      const letters = Array.from(lines[phraseIndex]);
      letterIndex += deleting ? -1 : 1;
      $("bio-visual").textContent = letters.slice(0, Math.max(0, letterIndex)).join("");

      let delay = deleting ? 32 : 65;
      if (!deleting && letterIndex >= letters.length) {
        deleting = true;
        delay = 2100;
      } else if (deleting && letterIndex <= 0) {
        deleting = false;
        phraseIndex = (phraseIndex + 1) % lines.length;
        delay = 350;
      }
      typingTimer = setTimeout(typeStep, delay);
    }

    function syncTyping() {
      clearTimeout(typingTimer);
      const animate = fx.typewriter && !reduced.matches && lines.some(Boolean);
      $("caret").hidden = !animate;

      if (!animate) {
        $("bio-visual").textContent = lines[0];
      } else if (!document.hidden) {
        typingTimer = setTimeout(typeStep, 100);
      }
    }

    // Audio: play() viene chiamato direttamente nel gesto dell'utente.
    const audio = $("audio");
    const hasAudio = Boolean(CONFIG.audio.url && fx.audioPlayer);
    let audioBusy = false;

    $("player").hidden = !fx.audioPlayer;
    audio.loop = Boolean(CONFIG.audio.loop);
    audio.volume = clamp(Number(CONFIG.audio.volume) || 0, 0, 1);
    $("volume").value = audio.volume;

    if (hasAudio) audio.src = CONFIG.audio.url;
    else {
      $("play").disabled = true;
      $("volume").disabled = true;
      $("audio-status").textContent = "Nessuna traccia configurata";
      $("entry").setAttribute("aria-label", "Entra nel profilo");
    }

    function audioFeedback(message) {
      $("audio-status").textContent = message;
      $("audio-message").textContent = message;
    }

    async function startAudio() {
      if (!hasAudio || audioBusy) return;
      audioBusy = true;
      try {
        await audio.play();
      } catch {
        audioFeedback("Audio non disponibile: riprova con Play");
      } finally {
        audioBusy = false;
      }
    }

    function syncPlayButton() {
      const playing = !audio.paused && !audio.ended;
      $("play-icon").setAttribute("href", playing ? "#i-pause" : "#i-play");
      $("play").setAttribute("aria-label", playing ? "Metti in pausa" : "Riproduci musica");
      $("play").setAttribute("aria-pressed", String(playing));
      if (playing) $("audio-status").textContent = "In riproduzione";
      else if (hasAudio && !audio.error) $("audio-status").textContent = "In pausa";
    }

    $("play").addEventListener("click", () => {
      if (audio.paused) startAudio();
      else audio.pause();
    });

    $("volume").addEventListener("input", event => {
      audio.volume = Number(event.target.value);
    });

    for (const event of ["play", "pause", "ended"]) {
      audio.addEventListener(event, syncPlayButton);
    }

    audio.addEventListener("error", () => {
      audioFeedback("Traccia non raggiungibile");
      $("progress").disabled = true;
    });

    function timeLabel(seconds) {
      if (!Number.isFinite(seconds)) return "--:--";
      const value = Math.max(0, Math.floor(seconds));
      return `${Math.floor(value / 60)}:${String(value % 60).padStart(2, "0")}`;
    }

    function syncProgress() {
      const usable = Number.isFinite(audio.duration) && audio.duration > 0;
      $("progress").disabled = !usable;
      $("progress").value = usable ? audio.currentTime / audio.duration * 100 : 0;
      $("progress").setAttribute(
        "aria-valuetext",
        `${timeLabel(audio.currentTime)} di ${timeLabel(audio.duration)}`
      );
      $("elapsed").textContent = timeLabel(audio.currentTime);
      $("duration").textContent = timeLabel(audio.duration);
    }

    for (const event of ["timeupdate", "loadedmetadata", "durationchange", "emptied"]) {
      audio.addEventListener(event, syncProgress);
    }

    $("progress").addEventListener("input", event => {
      if (Number.isFinite(audio.duration) && audio.duration > 0) {
        audio.currentTime = Number(event.target.value) / 100 * audio.duration;
      }
    });

    let entered = !fx.entry;

    function enter() {
      if (entered) return;
      entered = true;
      startAudio();
      syncBackgroundVideo();
      $("main").inert = false;
      document.body.classList.remove("waiting");
      $("entry").classList.add("leaving");
      $("profile").focus({ preventScroll: true });
      setTimeout(() => $("entry").hidden = true, reduced.matches ? 0 : 650);
    }

    if (fx.entry) {
      document.body.classList.add("waiting");
      $("main").inert = true;
      $("entry").addEventListener("click", enter, { once: true });
    } else {
      $("entry").hidden = true;
      // Senza schermata d'ingresso, l'audio parte dal pulsante Play.
    }

    // Fetch con timeout e fallback silenzioso.
    async function getJSON(url, timeout = 6500) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), timeout);
      try {
        const response = await fetch(url, {
          signal: controller.signal,
          cache: "no-store",
          credentials: "omit"
        });
        if (!response.ok) throw new Error("Servizio non disponibile");
        return await response.json();
      } finally {
        clearTimeout(timer);
      }
    }

    // Lanyard REST: nessun token richiesto e nessun dato inventato.
    const discordEnabled = fx.discordWidget && /^\d{17,20}$/.test(CONFIG.discord.userId);
    let discordTimer = null;
    let discordBusy = false;

    async function refreshDiscord() {
      if (!discordEnabled || discordBusy || document.hidden) return;
      discordBusy = true;

      try {
        const result = await getJSON(
          `https://api.lanyard.rest/v1/users/${CONFIG.discord.userId}`
        );
        if (!result.success || !result.data?.discord_user) throw new Error("Nessun dato");

        const data = result.data;
        const user = data.discord_user;
        const states = {
          online: ["Online", "#65dc91"],
          idle: ["Assente", "#f3ca69"],
          dnd: ["Non disturbare", "#ff7777"],
          offline: ["Offline", "#909b92"]
        };
        const [label, color] = states[data.discord_status] || states.offline;

        $("discord-name").textContent = user.global_name || user.username || "Discord";
        $("discord-dot").style.backgroundColor = color;

        const activity = (data.activities || []).find(item => item.type !== 4);
        let detail = "Nessuna attività";
        if (data.listening_to_spotify && data.spotify) {
          detail = `♫ ${data.spotify.song} · ${data.spotify.artist}`;
        } else if (activity) {
          detail = [activity.name, activity.details || activity.state].filter(Boolean).join(" · ");
        }

        $("discord-activity").textContent = `${label} · ${detail}`;

        const avatarUrl = /^[a-zA-Z0-9_]+$/.test(user.avatar || "")
          ? `https://cdn.discordapp.com/avatars/${CONFIG.discord.userId}/${user.avatar}.png?size=80`
          : fallbackAvatar;

        loadImage($("discord-avatar"), avatarUrl, fallbackAvatar);
        $("discord").hidden = false;
      } catch {
        // Nasconde anche dati precedenti: non mostra uno stato ormai obsoleto.
        $("discord").hidden = true;
      } finally {
        discordBusy = false;
      }
    }

    function syncDiscord() {
      clearInterval(discordTimer);
      if (!discordEnabled || document.hidden) return;
      refreshDiscord();
      discordTimer = setInterval(
        refreshDiscord,
        Math.max(15000, Number(CONFIG.discord.refreshMs) || 30000)
      );
    }

    // Una GET per apertura pagina; nessun localStorage e nessun polling.
    async function countVisit() {
      $("visits").hidden = !fx.visitCounter;
      if (!fx.visitCounter) return;

      try {
        const base = CONFIG.counter.endpoint.replace(/\/+$/, "");
        const namespace = encodeURIComponent(CONFIG.counter.namespace);
        const key = encodeURIComponent(CONFIG.counter.key);
        const result = await getJSON(`${base}/${namespace}/view/${key}?readOnly=false`);
        const count = Number(result.value);

        if (!Number.isFinite(count) || count < 0) throw new Error("Contatore non valido");
        $("visit-count").textContent = `${new Intl.NumberFormat("it-IT").format(count)} visite`;
        $("visits").title = "Visualizzazioni complessive della pagina";
      } catch {
        $("visit-count").textContent = CONFIG.counter.fallback;
      }
    }

    // Tilt solo su mouse/trackpad; nessuna intercettazione dei gesti touch.
    $("profile").addEventListener("pointermove", event => {
      if (!fx.tilt || reduced.matches || !finePointer.matches || event.pointerType === "touch") return;
      const rect = $("profile").getBoundingClientRect();
      const x = (event.clientX - rect.left) / rect.width - .5;
      const y = (event.clientY - rect.top) / rect.height - .5;
      $("profile").style.setProperty("--rx", `${-y * 7}deg`);
      $("profile").style.setProperty("--ry", `${x * 7}deg`);
    });

    function resetTilt() {
      $("profile").style.setProperty("--rx", "0deg");
      $("profile").style.setProperty("--ry", "0deg");
    }

    $("profile").addEventListener("pointerleave", resetTilt);
    $("profile").addEventListener("focusin", resetTilt);

    // Canvas leggero, DPR limitato e unico ciclo RAF per particelle/cursore.
    const canvas = $("particles");
    const context = canvas.getContext("2d");
    let width = 0, height = 0, dots = [];
    let frame = 0, previousTime = 0;
    const pointer = { x: 0, y: 0, tx: 0, ty: 0, visible: false };

    function resizeCanvas() {
      width = innerWidth;
      height = innerHeight;
      const dpr = Math.min(devicePixelRatio || 1, 2);
      canvas.width = Math.round(width * dpr);
      canvas.height = Math.round(height * dpr);
      context?.setTransform(dpr, 0, 0, dpr, 0, 0);

      const count = clamp(Number(fx.particleCount) || 0, 0, width < 600 ? 40 : 100);
      dots = Array.from({ length: count }, () => ({
        x: Math.random() * width,
        y: Math.random() * height,
        radius: Math.random() * 1.3 + .4,
        speed: Math.random() * 13 + 5,
        phase: Math.random() * Math.PI * 2
      }));
    }

    function cursorEnabled() {
      return fx.customCursor && finePointer.matches && !reduced.matches;
    }

    function hideCursor() {
      pointer.visible = false;
      $("cursor").style.opacity = "0";
      $("cursor-trail").style.opacity = "0";
      document.body.classList.remove("cursor-on");
    }

    document.addEventListener("pointermove", event => {
      if (!cursorEnabled() || event.pointerType === "touch") return;
      pointer.x = event.clientX;
      pointer.y = event.clientY;
      if (!pointer.visible) {
        pointer.tx = pointer.x;
        pointer.ty = pointer.y;
      }
      pointer.visible = true;
      document.body.classList.add("cursor-on");
    }, { passive: true });

    document.documentElement.addEventListener("pointerleave", hideCursor);
    window.addEventListener("blur", hideCursor);
    window.addEventListener("resize", resizeCanvas, { passive: true });

    function draw(time) {
      frame = 0;
      if (document.hidden || reduced.matches) return;
      const delta = Math.min((time - (previousTime || time)) / 1000, .05);
      previousTime = time;

      if (fx.particles && context) {
        context.clearRect(0, 0, width, height);
        context.fillStyle = accent;

        for (const dot of dots) {
          const snow = fx.particleStyle === "snow";
          dot.y += dot.speed * delta * (snow ? 1.6 : .45);
          dot.x += Math.sin(time / 2500 + dot.phase) * delta * (snow ? 9 : 2);
          if (dot.y > height + 3) dot.y = -3;
          if (dot.x < -3) dot.x = width + 3;
          if (dot.x > width + 3) dot.x = -3;

          context.globalAlpha = fx.particleStyle === "stars"
            ? .18 + (Math.sin(time / 1400 + dot.phase) + 1) * .2
            : .4;
          context.beginPath();
          context.arc(dot.x, dot.y, dot.radius, 0, Math.PI * 2);
          context.fill();
        }
      }

      if (cursorEnabled() && pointer.visible) {
        pointer.tx += (pointer.x - pointer.tx) * .17;
        pointer.ty += (pointer.y - pointer.ty) * .17;
        $("cursor").style.transform = `translate3d(${pointer.x - 3.5}px,${pointer.y - 3.5}px,0)`;
        $("cursor").style.opacity = "1";
        $("cursor-trail").style.transform = `translate3d(${pointer.tx - 14.5}px,${pointer.ty - 14.5}px,0)`;
        $("cursor-trail").style.opacity = fx.cursorTrail ? ".5" : "0";
      }

      if (fx.particles || cursorEnabled()) frame = requestAnimationFrame(draw);
    }

    function syncMotion() {
      cancelAnimationFrame(frame);
      frame = 0;
      previousTime = 0;
      resetTilt();
      hideCursor();
      context?.clearRect(0, 0, width, height);
      if (!document.hidden && !reduced.matches && (fx.particles || cursorEnabled())) {
        frame = requestAnimationFrame(draw);
      }
      syncTyping();
      syncBackgroundVideo();
    }

    // Titolo discreto; la preferenza di movimento ridotto viene rispettata.
    const titles = [defaultTitle, `${CONFIG.username} · afterhours`, `${CONFIG.username} · ✦`];
    let titleIndex = 0;
    setInterval(() => {
      if (!fx.animatedTitle || reduced.matches || document.hidden) return;
      document.title = titles[++titleIndex % titles.length];
    }, 2600);

    reduced.addEventListener("change", () => {
      document.title = defaultTitle;
      syncMotion();
    });
    finePointer.addEventListener("change", syncMotion);
    document.addEventListener("visibilitychange", () => {
      syncMotion();
      syncDiscord();
      if (document.hidden) document.title = defaultTitle;
    });

    resizeCanvas();
    syncMotion();
    syncDiscord();
    countVisit();
  </script>
</body>
</html>
